name: ma3adna
description: "تقسيمة - تطبيق حجز ملاعب كرة القدم في مصر"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

# App icon — artwork is drawn by tool/icon/render_icon_test.dart.
# Regenerate: flutter test tool/icon/render_icon_test.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"

# Native launch screen (shown before Flutter starts) in the brand green.
# Regenerate: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1B8A3A"
  image: "assets/icon/splash.png"
  android_12:
    color: "#1B8A3A"
    image: "assets/icon/foreground.png"
    icon_background_color: "#1B8A3A"
